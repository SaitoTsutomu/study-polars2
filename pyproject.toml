[project]
authors = [{name = "Saito Tsutomu", email = "tsutomu7@hotmail.co.jp"}]
dependencies = [
  "jupyter>=1.1.1",
  "polars[numpy,pandas,plot,pyarrow]>=1.43",
]
description = "Polars 100 knock"
license = {text = "Apache-2.0"}
name = "study-polars2"
readme = "README.md"
requires-python = ">=3.14"
version = "2026.8.14"

[dependency-groups]
dev = [
  "jupyterlab-freeze>=0.1.2",
  "more-itertools>=11.1.0",
]

[project.urls]
homepage = "https://github.com/SaitoTsutomu/study-polars2"

[project.scripts]
study-polars2 = "study_polars2:main"

[tool.taskipy.tasks]
check = "uv run src/tools/create_check_code.py && uv run tmp/code_ok.py | grep NG && uv run tmp/code_ng.py | grep OK"
jupyter = "uv run jupyter lab -y nbs"
license = "uv run -w pip-licenses pip-licenses"
lint = "ruff check src && pyrefly check src"
study = "uv run study-polars2"

[tool.uv]
exclude-newer = "3 days"

[[tool.uv.index]]
default = true
url = "https://pypi.flatt.tech/simple/"

[tool.pyrefly]
project-includes = ["src"]

[tool.ruff]
exclude = ["*.ipynb"]
src = ["src"]

[tool.ruff.lint]
ignore = [
  "missing-trailing-comma",
  "CPY",
  "incorrect-blank-line-before-class",
  "multi-line-summary-second-line",
  "missing-trailing-period",
  "missing-terminal-punctuation",
  "docstring-missing-returns",
  "docstring-missing-exception",
  "line-too-long",
  "implicit-namespace-package",
]
preview = true
select = ["ALL"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[build-system]
build-backend = "uv_build"
requires = ["uv_build>=0.8.4,<0.9.0"]
